<main class="ed-wrap" id="main">
<div style="padding:28px var(--page-x) 0"><div class="ed-label">04 — Guide</div><h1 class="ed-h1" style="margin:12px 0 10px">러닝 가이드</h1><p class="ed-lede">입문부터 풀코스까지, 읽고 바로 따라 할 수 있게 훈련·부상·대회 준비 글을 난이도별로 묶었어요.</p></div>
<div class="ed-filter" style="padding:0 var(--page-x);margin-top:22px"><div class="ed-filter-row" id="tabs" role="group" aria-label="수준 선택"></div></div>
<div style="padding:18px var(--page-x) 0"><div class="ed-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="글 검색 (예: 인터벌, 무릎, 젤)" aria-label="가이드 글 검색"></div></div>
<section class="ed-section" style="margin-top:24px"><div class="ed-section-head" style="margin-bottom:0"><h2 class="ed-h2" id="listTitle">전체 글</h2><span class="ed-small ed-tab-num"><b id="count" style="color:var(--ink)">0</b>편</span></div><div class="ed-list ed-guide-grid" id="out" style="border-top:0" aria-live="polite"><div class="ed-empty" style="grid-column:1/-1">불러오는 중…</div></div></section>
<div style="padding:8px var(--page-x) 0"><p class="ed-small" style="line-height:1.8">핵심만 빠르게 보고 싶다면 <a class="ed-link" href="guide.html">한 장 요약</a>을 보세요. 이 글들은 일반적인 참고 정보이며 개인의 건강 상태에 맞춘 처방이 아니에요. 통증이나 지병이 있으면 의사와 먼저 상담하세요.</p></div>
</main>
<script>
layout('blog');
document.title=document.title.replace('Run우리',SITE.name);
let IDX=null; const S={lv:'전체',q:''};
const qs=new URLSearchParams(location.search); if(BLOG_LEVELS.includes(qs.get('level'))) S.lv=qs.get('level'); if(qs.get('q')){ S.q=qs.get('q'); $('#q').value=S.q; }
function draw(){
  if(!IDX) return;
  const cnt=lv=>lv==='전체'?IDX.posts.length:IDX.posts.filter(p=>p.level===lv).length;
  $('#tabs').innerHTML=['전체',...BLOG_LEVELS].map(l=>`<button type="button" class="${S.lv===l?'is-on':''}" data-lv="${l}" aria-pressed="${S.lv===l}">${l}<span class="c">${cnt(l)}</span></button>`).join('');
  const q=S.q.toLowerCase();
  const L=IDX.posts.filter(p=>(S.lv==='전체'||p.level===S.lv)&&(!q||(p.title+p.summary).toLowerCase().includes(q)));
  $('#count').textContent=L.length; $('#listTitle').textContent=S.lv==='전체'?'전체 글':S.lv+' 글';
  $('#out').innerHTML=L.map(p=>blogRow(p)).join('')||'<div class="ed-empty" style="grid-column:1/-1">검색 결과가 없어요. 다른 단어로 찾아보세요.</div>';
}
function sync(){ const u=new URLSearchParams(); if(S.lv!=='전체') u.set('level',S.lv); if(S.q) u.set('q',S.q); history.replaceState(null,'',location.pathname+(u.toString()?'?'+u:'')); }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-lv]'); if(b){ S.lv=b.dataset.lv; draw(); sync(); const nb=$(`[data-lv="${S.lv}"]`); if(nb) nb.focus(); } });
$('#q').oninput=e=>{ S.q=e.target.value.trim(); draw(); sync(); };
loadBlogIndex().then(j=>{ IDX=j; draw(); }).catch(()=>{ $('#out').innerHTML='<div class="ed-empty" style="grid-column:1/-1">글 목록을 불러오지 못했어요. 새로고침해 주세요.</div>'; });
</script></body></html>
