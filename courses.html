<main class="ed-wrap" id="main">
<div style="padding:28px var(--page-x) 0"><div class="ed-label">03 — Courses</div><h1 class="ed-h1" style="margin:12px 0 10px">러닝 코스</h1><p class="ed-lede">권역별로 모은 전국 러닝 코스. 코스 이름은 러닝온 목록을 참고했고, 정확한 위치는 ‘지도에서 보기’로 확인하세요.</p></div>
<div style="margin-top:18px"><div class="ed-sample"><span class="ed-label">안내</span><span>코스 이름은 러닝온 목록을 참고했어요. 거리는 목록에 표기된 코스만 적었고, 지도에는 코스 위치·경로를 표시하지 않아요.</span></div></div>
<div class="ed-filter" style="padding:0 var(--page-x);margin-top:22px"><div class="ed-filter-row" id="tabs"></div></div>
<div class="ed-map" style="margin-top:20px"><div id="map" style="position:absolute;inset:0"></div>
 <div class="ed-map-fallback" id="fallback" hidden><div id="fbsvg" style="position:absolute;inset:0"></div><div class="ed-small" style="position:absolute;left:12px;bottom:10px;right:12px" id="fbmsg"></div></div>
 <div class="ed-map-tag ed-label ink" id="maptag"></div></div>
<div class="ed-caption" style="margin-top:8px"><span>지도 © OpenStreetMap · 코스 위치와 경로는 표시하지 않아요 (좌표 정보가 없는 코스는 지도 링크로 확인)</span></div>
<div style="padding:22px var(--page-x) 0"><div class="ed-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="코스 검색 (예: 호수, 한강, 해안)" aria-label="코스 검색"></div>
  <div class="ed-filter"><div class="ed-filter-label"><span class="ed-label">지역</span></div><div class="ed-filter-row" id="chips"></div></div></div>
<section class="ed-section" style="margin-top:36px"><div class="ed-section-head" style="margin-bottom:0"><h2 class="ed-h2">코스 목록</h2><span class="ed-small ed-tab-num"><b id="count" style="color:var(--ink)">0</b>곳 · 저장한 코스 <b id="ccount" style="color:var(--ink)">0</b></span></div>
 <div class="ed-list ed-course-grid" id="out" style="border-top:0"></div></section>
</main>
<script>
layout('courses');
const S={g:'전체',r:'전체',q:'',sel:null}; const qp=new URLSearchParams(location.search); if(qp.get('group')) S.g=qp.get('group'); if(qp.get('g')) S.g=qp.get('g');
const groupOf=r=>Object.keys(REGION_GROUPS).find(g=>REGION_GROUPS[g].includes(r));
const inGroup=c=>S.g==='전체'||REGION_GROUPS[S.g].includes(c.region);
const kmNum=c=>{ const m=(c.km||'').match(/[\d.]+/); return m?m[0]:null; };
/* 지도: 선택한 권역·지역 단위로만 이동. 좌표(lat,lng)가 data.js에 있는 코스에만 마커를 찍습니다. */
const VIEW={'전체':[36.4,127.8,7],'수도권':[37.5,127.0,9],'충청권':[36.5,127.3,8],'강원권':[37.8,128.2,8],'영남권':[35.8,128.9,8],'호남권':[35.3,126.9,8],'제주':[33.38,126.55,10],
 '서울':[37.56,126.98,11],'경기':[37.5,127.2,9],'인천':[37.46,126.65,10],'세종':[36.55,127.26,11],'대전':[36.35,127.38,11],'충북':[36.75,127.75,9],'충남':[36.6,126.8,9],'강원':[37.75,128.3,8],'부산':[35.17,129.07,10],'대구':[35.87,128.6,10],'울산':[35.54,129.31,10],'경북':[36.4,128.9,8],'경남':[35.4,128.3,9],'광주':[35.16,126.85,10],'전남':[34.85,126.9,8],'전북':[35.7,127.1,9]};
let map=null, tileOK=false, tileErr=0, markers=[]; const fb=$('#fallback');
function showFallback(msg){ fb.hidden=false; $('#fbmsg').textContent=msg; drawFallback(); }
function drawFallback(){ let s='<svg viewBox="0 0 390 300" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">'; for(let i=1;i<8;i++) s+=`<path d="M0 ${i*38} C 100 ${i*38-18}, 230 ${i*38+20}, 390 ${i*38-6}" fill="none" stroke="#D8D1C2" stroke-width="1"/>`;
  s+=`<text x="195" y="150" text-anchor="middle" font-size="22" font-family="serif" fill="#47443D">${S.r!=='전체'?S.r:S.g}</text></svg>`; $('#fbsvg').innerHTML=s; }
function initMap(){
  if(!window.L){ showFallback('지도 라이브러리를 불러오지 못했어요. 각 코스의 ‘지도에서 보기’ 링크를 이용하세요.'); return; }
  map=L.map('map',{zoomControl:false,attributionControl:true,scrollWheelZoom:false,zoomSnap:0.25}).setView([36.4,127.8],7);
  const t=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
  t.on('tileload',()=>{tileOK=true; fb.hidden=true;}); t.on('tileerror',()=>{tileErr++; if(!tileOK&&tileErr>=2) showFallback('지도 타일을 불러오지 못했어요. 각 코스의 ‘지도에서 보기’ 링크를 이용하세요.');});
  L.control.zoom({position:'bottomright'}).addTo(map); setTimeout(()=>{ if(!tileOK) showFallback('지도 타일을 불러오지 못했어요. 각 코스의 ‘지도에서 보기’ 링크를 이용하세요.'); },5000);
}
function focusMap(){
  const key=S.r!=='전체'?S.r:S.g, v=VIEW[key]||VIEW['전체'];
  if(map){ map.setView([v[0],v[1]],v[2],{animate:false}); markers.forEach(m=>map.removeLayer(m)); markers=[];
    COURSES.filter(c=>c.lat&&c.lng&&inGroup(c)&&(S.r==='전체'||c.region===S.r)).forEach((c,i)=>{ const m=L.marker([c.lat,c.lng],{icon:L.divIcon({className:'',html:`<div class="ed-pin ${c.id===S.sel?'on':''}">${i+1}</div>`,iconSize:[0,0]})}).addTo(map); markers.push(m); }); }
  const cur=COURSES.find(c=>c.id===S.sel);
  $('#maptag').textContent=cur?`${cur.region} · ${cur.name}`:`${key}`;
  if(!fb.hidden) drawFallback();
}
function draw(){
  $('#tabs').innerHTML=['전체',...Object.keys(REGION_GROUPS)].map(g=>`<button class="${S.g===g?'is-on':''}" data-g="${g}">${g}<span class="c">${g==='전체'?COURSES.length:COURSES.filter(c=>REGION_GROUPS[g].includes(c.region)).length}</span></button>`).join('');
  const regs=S.g==='전체'?Object.values(REGION_GROUPS).flat():REGION_GROUPS[S.g];
  $('#chips').innerHTML=['전체',...regs].map(r=>`<button class="${S.r===r?'is-on':''}" data-r="${r}">${r}</button>`).join('');
  const L=COURSES.filter(c=>inGroup(c)&&(S.r==='전체'||c.region===S.r)&&(!S.q||(c.name+c.region).includes(S.q)));
  $('#count').textContent=L.length; $('#ccount').textContent=cfavs.get().length;
  $('#out').innerHTML=L.length?L.map((c,i)=>{ const k=kmNum(c);
    return `<article class="ed-course ${c.id===S.sel?'is-on':''}" data-id="${c.id}"><span class="ix">${p2(i+1)}</span>
      <div><h3>${esc(c.name)}</h3><p class="ed-meta">${c.region}${sep}${groupOf(c.region)}${sep}${k?c.km:'거리 확인 필요'}</p>
      <a class="ed-link ed-small" style="display:inline-block;margin-top:6px;color:var(--ink-2)" target="_blank" rel="noopener" href="https://map.naver.com/p/search/${encodeURIComponent(c.name+' 러닝')}">지도에서 보기 ↗</a></div>
      <div class="ed-race-side">${k?`<div class="km">${k}<small>km</small></div>`:'<span></span>'}${bookmark(c.id,cfavs.has(c.id),'data-cfav','코스 저장')}</div></article>`; }).join(''):'<div class="ed-empty" style="grid-column:1/-1">검색 결과가 없어요.</div>';
  focusMap();
}
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-g]'); if(g){S.g=g.dataset.g;S.r='전체';draw();return;}
  const r=e.target.closest('[data-r]'); if(r){S.r=r.dataset.r;draw();return;}
  const row=e.target.closest('.ed-course[data-id]'); if(row&&!e.target.closest('a')){ S.sel=S.sel===row.dataset.id?null:row.dataset.id; $$('.ed-course').forEach(x=>x.classList.toggle('is-on',x.dataset.id===S.sel)); focusMap(); }
});
$('#q').oninput=e=>{S.q=e.target.value.trim();draw();}; bindFav(()=>{$('#ccount').textContent=cfavs.get().length;}); initMap(); draw();
</script></body></html>
