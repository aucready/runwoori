<main class="ed-wrap" id="main">
<div style="padding:28px var(--page-x) 0"><div class="ed-label">04 — Guide</div><h1 class="ed-h1" style="margin:12px 0 10px">한 장 요약</h1><p class="ed-lede">바쁠 때 훑어보기 좋게 주제마다 핵심만 적었어요. 이유와 근거까지 읽고 싶다면 <a class="ed-link" href="blog.html">러닝 가이드 글</a>로 이어가세요.</p></div>
<div class="ed-filter" style="padding:0 var(--page-x);margin-top:22px"><div class="ed-filter-row" id="tabs"></div></div>
<div style="padding:18px var(--page-x) 0"><div class="ed-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="주제로 찾기" aria-label="요약 검색"></div></div>
<section class="ed-section" style="margin-top:24px"><div class="ed-section-head" style="margin-bottom:0"><h2 class="ed-h2">모든 요약</h2><span class="ed-small ed-tab-num"><b id="count" style="color:var(--ink)">0</b>편</span></div><div class="ed-list ed-guide-grid" id="out" style="border-top:0"></div></section>
</main>
<div class="ed-sheet-bg" id="modal" role="dialog" aria-modal="true" aria-label="요약 내용"><div class="ed-sheet"><button class="ed-sheet-x" id="close">닫기 ✕</button><div id="mbody"></div></div></div>
<script>
layout('blog');
const cats=['전체',...new Set(GUIDES.map(g=>g.cat))]; const S={cat:'전체',q:''};
function draw(){
  $('#tabs').innerHTML=cats.map(c=>`<button class="${S.cat===c?'is-on':''}" data-c="${c}">${c}</button>`).join('');
  const L=GUIDES.filter(g=>(S.cat==='전체'||g.cat===S.cat)&&(!S.q||(g.title+g.sum).includes(S.q)));
  $('#count').textContent=L.length;
  $('#out').innerHTML=L.map((g,i)=>`<button class="ed-guide" data-g="${g.id}"><span class="ix">${p2(i+1)}</span><div><span class="ed-label">${g.cat}</span><h3>${g.title}</h3><p>${g.sum}</p></div><span class="ed-arrow" style="color:var(--ink-3)">→</span></button>`).join('')||'<div class="ed-empty" style="grid-column:1/-1">검색 결과가 없어요.</div>';
}
function open_(id){ const g=GUIDES.find(x=>x.id===id); if(!g) return; $('#mbody').innerHTML=`<span class="ed-label">${g.cat}</span><h2 class="ed-h1" style="margin:10px 0 6px">${g.title}</h2><p class="ed-small">${g.sum}</p><ul>${g.body.map(b=>`<li>${b}</li>`).join('')}</ul><p class="ed-small">※ 일반적인 참고 정보이며 개인 건강 상태에 따라 다를 수 있어요. 통증이나 이상이 있으면 전문의와 상담하세요.</p>`; LAST=document.activeElement; $('#modal').classList.add('show'); document.body.style.overflow='hidden'; $('#close').focus(); history.replaceState(null,'','#'+id); }
let LAST=null;
function close_(){ $('#modal').classList.remove('show'); document.body.style.overflow=''; history.replaceState(null,'',location.pathname); if(LAST&&LAST.focus) LAST.focus(); }
document.addEventListener('keydown',e=>{ if(e.key==='Tab'&&$('#modal').classList.contains('show')){ e.preventDefault(); $('#close').focus(); } });
document.addEventListener('click',e=>{ const c=e.target.closest('[data-c]'); if(c){S.cat=c.dataset.c;draw();} const g=e.target.closest('[data-g]'); if(g) open_(g.dataset.g); if(e.target.id==='modal'||e.target.closest('#close')) close_(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') close_(); });
$('#q').oninput=e=>{S.q=e.target.value.trim();draw();}; draw(); if(location.hash) open_(location.hash.slice(1)); window.addEventListener('hashchange',()=>{ if(location.hash) open_(location.hash.slice(1)); });
</script></body></html>
