  <div class="ed-plate" id="plate"><svg class="lanes" viewBox="0 0 390 250" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect x="40" y="30" width="310" height="190" rx="95" fill="none" stroke="#1C1B18" stroke-opacity="0.55" stroke-width="1"/><rect x="54" y="44" width="282" height="162" rx="81" fill="none" stroke="#1C1B18" stroke-opacity="0.22" stroke-width="1"/><rect x="68" y="58" width="254" height="134" rx="67" fill="none" stroke="#1C1B18" stroke-opacity="0.22" stroke-width="1"/><rect x="82" y="72" width="226" height="106" rx="53" fill="none" stroke="#1C1B18" stroke-opacity="0.22" stroke-width="1"/><rect x="96" y="86" width="198" height="78" rx="39" fill="none" stroke="#1C1B18" stroke-opacity="0.22" stroke-width="1"/><rect x="110" y="100" width="170" height="50" rx="25" fill="none" stroke="#1C1B18" stroke-opacity="0.22" stroke-width="1"/><rect x="124" y="114" width="142" height="22" rx="11" fill="none" stroke="#1C1B18" stroke-opacity="0.55" stroke-width="1"/><line x1="195" y1="30" x2="195" y2="128" stroke="#1C1B18" stroke-opacity=".55" stroke-width="1"/></svg><div class="cap" id="plateCap"></div></div>
  <div class="ed-hero-text" id="heroText">
    <img class="ed-hero-logo" src="assets/logo/runwoori-hero-light.svg" alt="Run우리" width="360" height="85">

<div class="ed-cols">
<section class="ed-section"><div class="ed-section-head"><span class="no">02</span><h2 class="ed-h2">내 목표 대회</h2></div><div id="goal"></div></section>

<section class="ed-section"><div class="ed-section-head"><span class="no">06</span><h2 class="ed-h2">내 관심 대회</h2><a class="ed-link" href="index.html?fav=1">모두 보기 →</a></div><div class="ed-list two" id="favs"></div></section>

<section class="ed-section"><div class="ed-section-head"><span class="no">07</span><h2 class="ed-h2">지역별 러닝 코스</h2><a class="ed-link" href="courses.html">전체 보기 →</a></div><div class="ed-list" id="regs"></div></section>

<script>
layout('home');
RACES_READY.then(()=>{
const R=allRaces().filter(r=>r.st.key!=='ended').sort((a,b)=>a.d-b.d);
const by=k=>R.filter(r=>r.st.key===k);
const wk=R.filter(r=>r.d>=0&&r.d<=7&&(r.dt.getDay()===6||r.dt.getDay()===0));
const empty=m=>`<div class="ed-empty" style="grid-column:1/-1">${m}</div>`;
const t=today();
/* 히어로: 사진 대신 트랙 레인 선화 + 가장 가까운 대회 D-day */
{ const n=R.find(r=>r.d>=0); $('#plateCap').innerHTML=n?`<div class="ed-label">NEXT RACE</div><div class="big">${ddayText(n.d)}</div><div class="nm">${esc(n.name)}</div><div class="ed-small" style="margin-top:2px">${fmtFull(n.dt)} · ${n.region}</div>`:''; }
function renderFigures(){
  const F=[['접수중',by('open').length,'index.html?status=open',''],['마감임박',by('urgent').length,'index.html?status=urgent','accent'],['접수예정',by('soon').length,'index.html?status=soon',''],['이번 주말',wk.length,'index.html?range=week','']];
  $('#figures').innerHTML=F.map(f=>`<a class="ed-figure" href="${f[2]}"><b class="${f[3]}">${f[1]}</b><span>${f[0]}</span></a>`).join('');
  $('#figNote').textContent=`${t.getMonth()+1}.${t.getDate()}(${WD[t.getDay()]}) 기준 · 수록 대회 ${RACES.length}개`;
}
function renderGoal(){
  const f=R.filter(r=>favs.has(r.id))[0];
  $('#goal').innerHTML=f?`<div class="ed-label">D-Day · 남은 날</div><div class="ed-num" style="font-size:var(--fs-num-xl);line-height:1;margin-top:10px;font-weight:400;letter-spacing:-0.06em">${f.d}<span style="font-size:18px;letter-spacing:0;margin-left:6px;font-family:var(--font-sans);color:var(--ink-3)">일</span></div>
    <h3 class="ed-h2" style="margin-top:18px">${esc(f.name)}</h3><p class="ed-small ed-tab-num" style="margin-top:6px"><span class="ed-status ${f.st.key}">${f.st.label}</span>&nbsp; ${fmtFull(f.dt)} · ${f.region}</p>
    <a class="ed-btn block" style="margin-top:22px" href="tools.html?date=${f.date}#plan">이 대회 훈련 계획 만들기 <span class="ed-arrow">→</span></a>`
  :`<h3 class="ed-h2">아직 저장한 대회가 없어요</h3><p class="ed-small" style="margin-top:8px">대회 옆 북마크를 눌러 저장하면 D-day와 훈련 계획이 여기에 연결돼요.</p><a class="ed-btn block" style="margin-top:22px" href="tools.html#plan">훈련 계획 만들기 <span class="ed-arrow">→</span></a>`;
}
function renderFavs(){ const f=R.filter(r=>favs.has(r.id)); $('#favs').innerHTML=f.length?f.slice(0,4).map(raceRow).join(''):empty('아직 저장한 대회가 없어요. 대회 옆 북마크를 눌러 보세요.'); renderGoal(); }
/* 접수 상태 탭: 접수 중 · 마감 임박 · 접수 예정 (한 목록) */
const TABS=[{k:'open',label:'접수 중',sort:(a,b)=>a.d-b.d,empty:'지금 접수 중인 대회가 없어요.'},
  {k:'urgent',label:'마감 임박',sort:(a,b)=>(a.close||'').localeCompare(b.close||''),empty:'지금은 마감 임박 대회가 없어요.'},
  {k:'soon',label:'접수 예정',sort:(a,b)=>(a.open||'9').localeCompare(b.open||'9')||a.d-b.d,empty:'접수 예정인 대회가 없어요.'}];
let tabK=(TABS.find(t=>by(t.k).filter(r=>r.d>=0).length)||TABS[0]).k;
const tabList=t=>by(t.k).filter(r=>r.d>=0).sort(t.sort);
function drawTabs(focus){
  $('#raceTabs').innerHTML=TABS.map(t=>`<button type="button" role="tab" id="tab-${t.k}" aria-selected="${t.k===tabK}" aria-controls="upcoming" tabindex="${t.k===tabK?0:-1}" data-tab="${t.k}" class="${t.k===tabK?'is-on':''}">${t.label}<span class="c">${tabList(t).length}</span></button>`).join('');
  const t=TABS.find(x=>x.k===tabK), L=tabList(t);
  $('#upcoming').setAttribute('aria-labelledby','tab-'+t.k);
  $('#upcoming').innerHTML=L.length?L.slice(0,6).map(raceRow).join(''):empty(t.empty);
  $('#raceAll').href='index.html?status='+t.k;
  if(focus) $('#tab-'+t.k).focus();
}
$('#raceTabs').addEventListener('click',e=>{ const b=e.target.closest('[data-tab]'); if(b){ tabK=b.dataset.tab; drawTabs(); } });
$('#raceTabs').addEventListener('keydown',e=>{
  const i=TABS.findIndex(t=>t.k===tabK); let n=-1;
  if(e.key==='ArrowRight') n=(i+1)%TABS.length; else if(e.key==='ArrowLeft') n=(i-1+TABS.length)%TABS.length; else if(e.key==='Home') n=0; else if(e.key==='End') n=TABS.length-1;
  if(n>=0){ e.preventDefault(); tabK=TABS[n].k; drawTabs(true); }
});
drawTabs();
/* 모바일 상단: 이번 주 대회 (오늘~7일, 대회 달력의 '이번 주' 필터와 같은 범위) */
{ let W=R.filter(r=>r.d>=0&&r.d<=7).sort((a,b)=>a.d-b.d||a.name.localeCompare(b.name));
  const n=W.length; let title='이번 주 대회', link=`index.html?range=week`;
  if(!n){ W=R.filter(r=>r.d>=0).slice(0,3); title='가까운 대회'; link='index.html'; }
  $('#weekTitle').textContent=title; $('#weekAll').href=link; $('#weekAll').textContent=n>5?`${n}개 모두 보기 →`:'전체 보기 →';
  $('#weekList').innerHTML=(W.length?W.slice(0,5).map(r=>`<a class="ed-wk" href="race.html?id=${r.id}"><span class="dt">${r.dt.getMonth()+1}.${r.dt.getDate()}<small>${WD[r.dt.getDay()]}</small></span><span class="bd"><b>${esc(r.name)}</b><span class="ed-meta">${[esc(r.region||'지역 확인 필요'),esc(r.dist.slice(0,2).join(' · '))].filter(Boolean).join(sep)}</span></span><span class="st"><span class="ed-status ${r.st.key}">${r.st.label}</span><span class="ed-dday ${ddayCls(r)}">${ddayText(r.d)}</span></span></a>`).join(''):empty('예정된 대회가 없어요.')); }
renderFigures(); renderFavs(); bindFav(renderFavs);
$('#quickPace').innerHTML=paceCalcHtml(); initPace($('#quickPace'));
$('#regs').innerHTML=Object.entries(REGION_GROUPS).map(([g,rs],i)=>`<a class="ed-course" href="courses.html?group=${encodeURIComponent(g)}" style="grid-template-columns:30px 1fr auto"><span class="ix">${p2(i+1)}</span><div><h3>${g}</h3><p class="ed-meta">${rs.join(' · ')}</p></div><div class="km">${COURSES.filter(c=>rs.includes(c.region)).length}<small>곳</small></div></a>`).join('');
loadBlogIndex().then(j=>{ const F=j.featured.map(id=>j.posts.find(p=>p.id===id)).filter(Boolean); $('#guides').innerHTML=F.map((p,i)=>blogRow(p,i+1)).join('')+`<p class="ed-small" style="grid-column:1/-1;margin-top:14px">초급 ${j.levels['초급']}편 · 중급 ${j.levels['중급']}편 · 고급 ${j.levels['고급']}편의 글이 있어요. <a class="ed-link" href="blog.html">수준별로 보기</a></p>`; }).catch(()=>{ $('#guides').innerHTML='<div class="ed-empty" style="grid-column:1/-1">가이드 글을 불러오지 못했어요.</div>'; });
$('#heroSearch').onsubmit=e=>{e.preventDefault(); location.href='index.html?q='+encodeURIComponent($('#hq').value.trim());};

});
</script></body></html>
