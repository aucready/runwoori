<main class="ed-wrap" id="main">
<section class="today-strip" aria-labelledby="todayTitle"><div class="today-head"><h2 class="ed-label" id="todayTitle">한눈에 보는 대회 현황</h2><span class="ed-small" id="figNote"></span></div><div class="ed-figures" id="figures"></div></section>
<div class="landing-title"><h1 class="ed-h1">마라톤 대회 달력</h1></div>
<div class="split">
<div class="side" id="side">
<div style="padding:22px var(--page-x) 0">
  <div class="side-top"><div class="ed-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="대회명을 검색해 보세요" aria-label="대회 검색"></div>
  <button type="button" class="ed-btn ghost fold-btn" id="foldBtn" aria-expanded="false" aria-controls="filters">필터</button></div>
  <div id="filters">
  <div class="ed-filter"><div class="ed-filter-label"><span class="ed-label">접수 상태</span></div><div class="ed-filter-row" id="fStatus"></div></div>
  <div class="ed-filter"><div class="ed-filter-label"><span class="ed-label">거리</span></div><div class="ed-filter-row" id="fDist"></div></div>
  <div class="ed-filter"><div class="ed-filter-label"><span class="ed-label">기간</span></div>
    <div class="ed-dates"><input type="date" class="ed-input" id="from" aria-label="시작일"><input type="date" class="ed-input" id="to" aria-label="종료일"></div>
    <div class="ed-chiprow" id="fQuick"><button data-q="wk">이번 주말</button><button data-q="m1">30일 내</button><button data-q="m3">3개월 내</button></div></div>
  <div style="margin-top:14px"><button id="reset" class="ed-link ed-small" style="background-color:transparent;border:0;cursor:pointer;color:var(--ink-2)" hidden>필터 초기화 ✕</button></div>
  </div>
</div>
</div>
<section class="ed-section main" id="mainCol" style="margin-top:22px">
  <div class="region-bar ed-filter" aria-label="지역 필터"><span class="ed-label">지역</span><div class="ed-filter-row" id="fRegion"></div></div>
  <div class="ed-cal race-cal" id="cal"></div>
  <div class="day-bar" id="dayBar" aria-live="polite"></div>
  <div class="ed-section-head" style="margin-bottom:0"><h2 class="ed-h2" id="listtitle">전체 대회</h2><span class="ed-small ed-tab-num"><b id="count" style="color:var(--ink)">0</b>개 · <span id="sortlbl">접수 중 먼저</span> <button type="button" class="ed-textbtn" id="sortBtn">날짜순으로 보기</button></span></div>
  <div class="ed-filter list-tabs" style="margin-top:0"><div class="ed-filter-row" id="listTabs" role="group" aria-label="접수 상태별 목록"></div></div>
  <div class="ed-list" id="list" style="border-top:0"></div>
  <p class="ed-caption src-note">신청 전에는 꼭 각 대회 공식 홈페이지에서 최신 내용을 확인하세요. 목록은 KorMarathon에 공개된 정보를 하루 한 번 수집하고, 주요 대회는 공식 홈페이지 확인값으로 보정해요.</p>
</section>
</div></main>
<script>
layout('races');
RACES_READY.then(()=>{
const S={sort:'reg',status:'all',region:'전체',dist:'전체',q:'',from:'',to:'',fav:false,day:null,month:null};
const R=allRaces();
(function renderToday(){
  const t=today(), by=k=>R.filter(r=>r.st.key===k).length, wk=R.filter(r=>r.d>=0&&r.d<=7&&(r.dt.getDay()===6||r.dt.getDay()===0)).length;
  const F=[['접수중',by('open'),'data-tab="open"',''],['마감임박',by('urgent'),'data-tab="urgent"','accent'],['접수예정',by('soon'),'data-tab="soon"',''],['이번 주말',wk,'data-q="wk"','']];
  $('#figures').innerHTML=F.map(f=>`<button type="button" class="ed-figure" ${f[2]}><b class="${f[3]}">${f[1]}</b><span>${f[0]}</span></button>`).join('');
  $('#figNote').textContent=`${t.getMonth()+1}.${t.getDate()}(${WD[t.getDay()]}) 기준 · 수록 대회 ${RACES.length}개`;
  $('#figures').addEventListener('click',e=>{ const b=e.target.closest('.ed-figure'); if(!b) return; S.from=S.to=''; $('#from').value=$('#to').value=''; S.day=null; if(b.dataset.q){ S.status='all'; S.fav=false; } setTimeout(()=>{ const el=document.querySelector('.region-bar'); if(el) window.scrollTo({top:el.getBoundingClientRect().top+scrollY-70,behavior:'smooth'}); },60); });
})();
const qs=new URLSearchParams(location.search);
if(qs.get('status')) S.status=qs.get('status'); if(qs.get('fav')||qs.get('tab')==='saved') S.fav=true; if(qs.get('q')){S.q=qs.get('q');$('#q').value=S.q;}
if(qs.get('range')==='week'){ const t=today(); S.from=iso(t); S.to=iso(new Date(+t+7*DAY)); }
const STAT=[['all','전체'],['open','접수중'],['urgent','마감임박'],['soon','접수예정'],['info','접수 확인'],['closed','마감']];
const REG=['전체',...['서울','경기','인천','강원','충북','충남','대전','세종','전북','전남','광주','경북','경남','대구','울산','부산','제주','전국'].filter(x=>RACES.some(r=>r.region===x))], DIST=[['전체','전체'],['5K','5K'],['10K','10K'],['하프','하프'],['풀','풀코스']];
if(qs.get('region')&&REG.includes(qs.get('region'))) S.region=qs.get('region');
function chips(id,items,key,counts){ $(id).innerHTML=items.map(([v,l])=>`<button class="${S[key]===v?'is-on':''}" data-k="${key}" data-v="${v}">${l}${counts&&counts[v]!=null?`<span class="c">${counts[v]}</span>`:''}</button>`).join(''); }
const RANK={urgent:0,open:0,soon:1,info:2,closed:3,ended:4};
function filtered(ignoreDay,ignoreStatus){
  return R.filter(r=>{
    if(r.st.key==='ended') return false;
    if(!ignoreStatus && S.status!=='all' && r.st.key!==S.status) return false;
    if(S.region!=='전체' && r.region!==S.region) return false;
    if(S.dist!=='전체' && !r.distTags.includes(S.dist)) return false;
    if(S.q && !(r.name+' '+r.region+' '+r.type+' '+r.venue+' '+r.organizer).toLowerCase().includes(S.q.toLowerCase())) return false;
    if(S.from && r.date<S.from) return false; if(S.to && r.date>S.to) return false;
    if(!ignoreStatus && S.fav && !favs.has(r.id)) return false;
    if(!ignoreDay && S.day && r.date!==S.day) return false; return true; }).sort((a,b)=> S.sort==='reg' ? (RANK[a.st.key]-RANK[b.st.key])||(a.d-b.d) : a.d-b.d);
}
function nActive(){ return [S.status!=='all',S.region!=='전체',S.dist!=='전체',!!S.q,!!(S.from||S.to),!!S.day].filter(Boolean).length; }
let LIM=60, SIG='';
function render(){
  const live=R.filter(r=>r.st.key!=='ended'), cnt={}; STAT.forEach(([v])=>cnt[v]=v==='all'?live.length:live.filter(r=>r.st.key===v).length);
  chips('#fStatus',STAT,'status',cnt); chips('#fRegion',REG.map(v=>[v,v]),'region'); chips('#fDist',DIST,'dist');
  const L=filtered(); $('#count').textContent=L.length;
  const sig=JSON.stringify([S.status,S.region,S.dist,S.q,S.from,S.to,S.fav,S.day]); if(sig!==SIG){LIM=60;SIG=sig;}
  $('#sortlbl').textContent=S.sort==='reg'?'접수 중 먼저':'대회일 순'; $('#sortBtn').textContent=S.sort==='reg'?'날짜순으로 보기':'접수 중 먼저 보기';
  $('#listtitle').textContent=S.fav?'관심 대회':(S.day?'그날의 대회':'전체 대회'); dayBar(L);
  { const base=filtered(true,true), c=k=>k==='all'?base.length:k==='saved'?base.filter(r=>favs.has(r.id)).length:base.filter(r=>r.st.key===k).length;
    const cur=S.fav?'saved':S.status;
    $('#listTabs').innerHTML=[['all','전체'],['open','접수 중'],['urgent','마감 임박'],['soon','접수 예정'],['saved','관심대회']].map(([k,l])=>`<button type="button" data-tab="${k}" class="${cur===k?'is-on':''}" aria-pressed="${cur===k}">${l}<span class="c">${c(k)}</span></button>`).join(''); }
  $('#reset').hidden=!nActive();
  { const n=nActive()-(S.region!=='전체'?1:0)-(S.day?1:0), o=$('#side').classList.contains('open'); $('#foldBtn').textContent=(o?'필터 닫기':'필터')+(n?` · ${n}`:''); $('#foldBtn').setAttribute('aria-expanded',o); }
  $('#list').innerHTML=L.length?L.slice(0,LIM).map(raceRow).join('')+(L.length>LIM?`<div class="ed-more"><button class="ed-btn ghost" id="more" type="button">${L.length-LIM}개 더 보기</button></div>`:''):`<div class="ed-empty">${S.fav?'저장한 대회가 없어요. 대회 옆 북마크를 눌러 보세요.':'조건에 맞는 대회가 없어요. 필터를 바꿔 보세요.'}</div>`;
  cal();
}
function dayBar(L){
  const el=$('#dayBar');
  if(S.day){ const d=pd(S.day); el.innerHTML=`<span class="dd"><b>${d.getMonth()+1}월 ${d.getDate()}일 (${WD[d.getDay()]})</b> · 대회 ${L.length}개</span><button type="button" class="ed-textbtn" id="dayClear">전체 보기 ✕</button>`; el.classList.add('on'); }
  else { el.innerHTML=`<span class="hint">날짜를 누르면 그날의 대회만 아래에 보여요</span>`; el.classList.remove('on'); }
}
document.addEventListener('click',e=>{ if(e.target.closest('#foldBtn')){ $('#side').classList.toggle('open'); render(); return; } if(e.target.closest('#more')){ LIM+=60; render(); } if(e.target.closest('#sortBtn')){ S.sort=S.sort==='reg'?'date':'reg'; render(); } });
const t0=()=>today();
function cal(){
  const t=today(); if(!S.month) S.month=new Date(t.getFullYear(),t.getMonth(),1);
  const y=S.month.getFullYear(), mo=S.month.getMonth();
  const base=filtered(true).filter(r=>r.date.startsWith(`${y}-${p2(mo+1)}`));
  const map={}; base.forEach(r=>{(map[r.date]=map[r.date]||[]).push(r);});
  const first=new Date(y,mo,1).getDay(), n=new Date(y,mo+1,0).getDate(), prevN=new Date(y,mo,0).getDate();
  const pm=new Date(y,mo-1,1).getMonth()+1, nm=new Date(y,mo+1,1).getMonth()+1;
  let h=`<div class="ed-cal-head"><h2>${y}년 ${mo+1}월</h2><div class="nav"><button id="prev" aria-label="${pm}월로">← ${pm}월</button><button id="todayBtn">오늘</button><button id="next" aria-label="${nm}월로">${nm}월 →</button></div></div><div class="ed-cal-grid">`;
  h+=WD.map(d=>`<div class="ed-cal-dow">${d}</div>`).join('');
  for(let i=first-1;i>=0;i--) h+=`<div class="ed-cal-day mute">${prevN-i}</div>`;
  for(let d=1;d<=n;d++){ const k=`${y}-${p2(mo+1)}-${p2(d)}`, dw=new Date(y,mo,d).getDay(), rs=map[k]||[];
    const dots=[...new Set(rs.map(r=>r.st.key))].slice(0,3).map(s=>`<i class="${s}"></i>`).join('')+(rs.length>1?`<b class="ct">${rs.length}</b>`:'');
    const nm=rs.slice(0,2).map(r=>`<span class="nm">${esc(r.name.replace(/^20\d\d\s*/,''))}</span>`).join('')+(rs.length>2?`<span class="nm more">+${rs.length-2}</span>`:'');
    const cls=`ed-cal-day ${dw===0?'sun':''} ${dw===6?'sat':''} ${rs.length?'has':''} ${k===iso(t)?'today':''} ${S.day===k?'sel':''}`;
    h+=rs.length?`<button class="${cls}" data-day="${k}" aria-pressed="${S.day===k}" aria-label="${mo+1}월 ${d}일 대회 ${rs.length}개">${d}<span class="m">${dots}</span><span class="nms">${nm}</span></button>`:`<div class="${cls}">${d}<span class="m"></span></div>`; }
  const used=first+n, tail=(7-used%7)%7; for(let i=1;i<=tail;i++) h+=`<div class="ed-cal-day mute">${i}</div>`;
  h+=`</div><div class="ed-cal-legend"><span class="ed-status open">접수중</span><span class="ed-status urgent">마감임박</span><span class="ed-status soon">접수예정</span><span class="ed-status closed">마감</span><span class="ed-status info">접수 확인</span></div><p class="ed-small" style="margin-top:12px">${mo+1}월 대회 ${base.length}개</p>`;
  $('#cal').innerHTML=h;
}
document.addEventListener('click',e=>{
  if(e.target.closest('#dayClear')){ S.day=null; render(); return; }
  const p=e.target.closest('[data-k]'); if(p){ S[p.dataset.k]=p.dataset.v; S.day=null; render(); return; }
  const d=e.target.closest('[data-day]'); if(d){ S.day=S.day===d.dataset.day?null:d.dataset.day; render(); if(S.day){ const y=$('#dayBar').getBoundingClientRect().top; if(y>innerHeight*0.8) window.scrollBy({top:y-innerHeight*0.62,behavior:'smooth'}); } return; }
  const tb=e.target.closest('[data-tab]'); if(tb){ const k=tb.dataset.tab; if(k==='saved'){ S.fav=true; S.status='all'; } else { S.fav=false; S.status=k; } render(); return; }
  if(e.target.closest('#todayBtn')){ S.month=new Date(t0().getFullYear(),t0().getMonth(),1); cal(); return; }
  if(e.target.closest('#prev')){ S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1); cal(); return; }
  if(e.target.closest('#next')){ S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1); cal(); return; }
  const q=e.target.closest('[data-q]'); if(q){ const t=today(); let f=t,to; if(q.dataset.q==='wk'){ const add=(6-t.getDay()+7)%7; f=new Date(+t+add*DAY); to=new Date(+f+DAY);} else if(q.dataset.q==='m1') to=new Date(+t+30*DAY); else to=new Date(+t+90*DAY);
    S.from=iso(f); S.to=iso(to); $('#from').value=S.from; $('#to').value=S.to; S.day=null; S.month=new Date(f.getFullYear(),f.getMonth(),1); render(); }
});
$('#q').oninput=e=>{S.q=e.target.value.trim();S.day=null;render();};
$('#from').onchange=e=>{S.from=e.target.value;render();}; $('#to').onchange=e=>{S.to=e.target.value;render();};
$('#reset').onclick=()=>{Object.assign(S,{status:'all',region:'전체',dist:'전체',q:'',from:'',to:'',day:null});['q','from','to'].forEach(i=>$('#'+i).value='');render();};
bindFav(()=>{ render(); });
if(S.from) $('#from').value=S.from; if(S.to) $('#to').value=S.to;
render();

});
</script></body></html>
