<main class="ed-wrap" id="main">
<div style="padding:28px var(--page-x) 0"><div class="ed-label">02 — Race Calendar</div><h1 class="ed-h1" style="margin:12px 0 10px">대회 달력</h1><p class="ed-lede">전국 마라톤 대회 일정을 날짜와 접수 상태로 찾아보세요. 마음에 드는 대회는 북마크로 저장해 둘 수 있어요.</p></div>
<div style="margin-top:18px"><div class="ed-sample"><span class="ed-label">안내</span><span>대회 정보는 러닝온·KorMarathon 공개 페이지에서 하루 한 번 자동 수집해요. 접수는 반드시 공식 홈페이지에서 확인하세요.</span></div></div>
<div class="split">
<div class="side" id="side">
<div style="padding:22px var(--page-x) 0">
  <div class="ed-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></svg><input id="q" type="search" placeholder="대회명을 검색해 보세요" aria-label="대회 검색"></div>
  <button type="button" class="ed-btn ghost fold-btn" id="foldBtn" aria-expanded="false" aria-controls="filters">필터 · 달력 열기</button>
  <div id="filters">
  <div class="ed-filter"><div class="ed-filter-label"><span class="ed-label">접수 상태</span></div><div class="ed-filter-row" id="fStatus"></div></div>
  <div class="ed-filter"><div class="ed-filter-label"><span class="ed-label">지역</span></div><div class="ed-filter-row" id="fRegion"></div></div>
  <div class="ed-filter"><div class="ed-filter-label"><span class="ed-label">거리</span></div><div class="ed-filter-row" id="fDist"></div></div>
  <div class="ed-filter"><div class="ed-filter-label"><span class="ed-label">기간</span></div>
    <div class="ed-dates"><input type="date" class="ed-input" id="from" aria-label="시작일"><input type="date" class="ed-input" id="to" aria-label="종료일"></div>
    <div class="ed-chiprow" id="fQuick"><button data-q="wk">이번 주말</button><button data-q="m1">30일 내</button><button data-q="m3">3개월 내</button></div></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><button id="reset" class="ed-link ed-small" style="background-color:transparent;border:0;cursor:pointer;color:var(--ink-2)" hidden>필터 초기화 ✕</button><span></span>
  <div class="ed-seg"><button data-view="cal" class="is-on">달력</button><button data-view="list">목록만</button></div></div>
  </div>
</div>
<section class="ed-section" id="calwrap" style="margin-top:28px"><div class="ed-cal" id="cal"></div></section>
</div>
<section class="ed-section main" style="margin-top:44px">
  <div class="ed-section-head" style="margin-bottom:0"><h2 class="ed-h2" id="listtitle">전체 대회</h2><span class="ed-small ed-tab-num"><b id="count" style="color:var(--ink)">0</b>개 · <span id="sortlbl">접수 중 먼저</span> <button type="button" class="ed-textbtn" id="sortBtn">날짜순으로 보기</button></span></div>
  <div class="ed-filter" style="margin-top:0"><div class="ed-filter-row" style="margin:0;padding:0"><button data-tab="all" class="is-on">전체</button><button data-tab="saved">관심 대회<span class="c" id="savedcnt">0</span></button></div></div>
  <div class="ed-list" id="list" style="border-top:0"></div>
</section>
</div></main>
<script>
layout('races');
RACES_READY.then(()=>{
const S={sort:'reg',status:'all',region:'전체',dist:'전체',q:'',from:'',to:'',fav:false,day:null,month:null};
const R=allRaces();
const qs=new URLSearchParams(location.search);
if(qs.get('status')) S.status=qs.get('status'); if(qs.get('fav')||qs.get('tab')==='saved') S.fav=true; if(qs.get('q')){S.q=qs.get('q');$('#q').value=S.q;}
if(qs.get('range')==='week'){ const t=today(); S.from=iso(t); S.to=iso(new Date(+t+7*DAY)); }
const STAT=[['all','전체'],['open','접수중'],['urgent','마감임박'],['soon','접수예정'],['info','접수 확인'],['closed','마감']];
const REG=['전체',...['서울','경기','인천','강원','충북','충남','대전','세종','전북','전남','광주','경북','경남','대구','울산','부산','제주','전국'].filter(x=>RACES.some(r=>r.region===x))], DIST=[['전체','전체'],['5K','5K'],['10K','10K'],['하프','하프'],['풀','풀코스']];
function chips(id,items,key,counts){ $(id).innerHTML=items.map(([v,l])=>`<button class="${S[key]===v?'is-on':''}" data-k="${key}" data-v="${v}">${l}${counts&&counts[v]!=null?`<span class="c">${counts[v]}</span>`:''}</button>`).join(''); }
const RANK={urgent:0,open:0,soon:1,info:2,closed:3,ended:4};
function filtered(ignoreDay){
  return R.filter(r=>{
    if(r.st.key==='ended') return false;
    if(S.status!=='all' && r.st.key!==S.status) return false;
    if(S.region!=='전체' && r.region!==S.region) return false;
    if(S.dist!=='전체' && !r.distTags.includes(S.dist)) return false;
    if(S.q && !(r.name+' '+r.region+' '+r.type+' '+r.venue+' '+r.organizer).toLowerCase().includes(S.q.toLowerCase())) return false;
    if(S.from && r.date<S.from) return false; if(S.to && r.date>S.to) return false;
    if(S.fav && !favs.has(r.id)) return false;
    if(!ignoreDay && S.day && r.date!==S.day) return false; return true; }).sort((a,b)=> S.sort==='reg' ? (RANK[a.st.key]-RANK[b.st.key])||(a.d-b.d) : a.d-b.d);
}
function nActive(){ return [S.status!=='all',S.region!=='전체',S.dist!=='전체',!!S.q,!!(S.from||S.to),!!S.day].filter(Boolean).length; }
let LIM=60, SIG='';
function render(){
  const live=R.filter(r=>r.st.key!=='ended'), cnt={}; STAT.forEach(([v])=>cnt[v]=v==='all'?live.length:live.filter(r=>r.st.key===v).length);
  chips('#fStatus',STAT,'status',cnt); chips('#fRegion',REG.map(v=>[v,v]),'region'); chips('#fDist',DIST,'dist');
  const L=filtered(); $('#count').textContent=L.length;
  const sig=JSON.stringify([S.status,S.region,S.dist,S.q,S.from,S.to,S.fav,S.day]); if(sig!==SIG){LIM=60;SIG=sig;}
  $('#sortlbl').textContent=S.sort==='reg'?'접수 중 먼저':'대회일 순'; $('#sortBtn').textContent=S.sort==='reg'?'날짜순으로 보기':'접수 중 먼저 보기';
  $('#listtitle').textContent=S.fav?'관심 대회':'전체 대회';
  $$('[data-tab]').forEach(b=>b.classList.toggle('is-on',(b.dataset.tab==='saved')===S.fav));
  $('#savedcnt').textContent=favs.get().length;
  $('#reset').hidden=!nActive();
  { const n=nActive(), o=$('#side').classList.contains('open'); $('#foldBtn').textContent=(o?'필터 · 달력 닫기':'필터 · 달력 열기')+(n?` · ${n}개 적용`:''); $('#foldBtn').setAttribute('aria-expanded',o); }
  $('#list').innerHTML=L.length?L.slice(0,LIM).map(raceRow).join('')+(L.length>LIM?`<div class="ed-more"><button class="ed-btn ghost" id="more" type="button">${L.length-LIM}개 더 보기</button></div>`:''):`<div class="ed-empty">${S.fav?'저장한 대회가 없어요. 대회 옆 북마크를 눌러 보세요.':'조건에 맞는 대회가 없어요. 필터를 바꿔 보세요.'}</div>`;
  cal();
}
document.addEventListener('click',e=>{ if(e.target.closest('#foldBtn')){ $('#side').classList.toggle('open'); render(); return; } if(e.target.closest('#more')){ LIM+=60; render(); } if(e.target.closest('#sortBtn')){ S.sort=S.sort==='reg'?'date':'reg'; render(); } });
function cal(){
  const t=today(); if(!S.month) S.month=new Date(t.getFullYear(),t.getMonth(),1);
  const y=S.month.getFullYear(), mo=S.month.getMonth();
  const base=filtered(true).filter(r=>r.date.startsWith(`${y}-${p2(mo+1)}`));
  const map={}; base.forEach(r=>{(map[r.date]=map[r.date]||[]).push(r);});
  const first=new Date(y,mo,1).getDay(), n=new Date(y,mo+1,0).getDate(), prevN=new Date(y,mo,0).getDate();
  const pm=new Date(y,mo-1,1).getMonth()+1, nm=new Date(y,mo+1,1).getMonth()+1;
  let h=`<div class="ed-cal-head"><h2>${y}년 ${mo+1}월</h2><div class="nav"><button id="prev">← ${pm}월</button><button id="next">${nm}월 →</button></div></div><div class="ed-cal-grid">`;
  h+=WD.map(d=>`<div class="ed-cal-dow">${d}</div>`).join('');
  for(let i=first-1;i>=0;i--) h+=`<div class="ed-cal-day mute">${prevN-i}</div>`;
  for(let d=1;d<=n;d++){ const k=`${y}-${p2(mo+1)}-${p2(d)}`, dw=new Date(y,mo,d).getDay(), rs=map[k]||[];
    const dots=[...new Set(rs.map(r=>r.st.key))].slice(0,3).map(s=>`<i class="${s}"></i>`).join('');
    const cls=`ed-cal-day ${dw===0?'sun':''} ${rs.length?'has':''} ${k===iso(t)?'today':''} ${S.day===k?'sel':''}`;
    h+=rs.length?`<button class="${cls}" data-day="${k}" aria-label="${mo+1}월 ${d}일 대회 ${rs.length}개">${d}<span class="m">${dots}</span></button>`:`<div class="${cls}">${d}<span class="m"></span></div>`; }
  const used=first+n, tail=(7-used%7)%7; for(let i=1;i<=tail;i++) h+=`<div class="ed-cal-day mute">${i}</div>`;
  h+=`</div><div class="ed-cal-legend"><span class="ed-status open">접수중</span><span class="ed-status urgent">마감임박</span><span class="ed-status soon">접수예정</span><span class="ed-status closed">마감</span><span class="ed-status info">접수 확인</span></div><p class="ed-small" style="margin-top:12px">${mo+1}월 대회 ${base.length}개 · 날짜를 누르면 그날의 대회만 보여요</p>`;
  $('#cal').innerHTML=h;
}
document.addEventListener('click',e=>{
  const p=e.target.closest('[data-k]'); if(p){ S[p.dataset.k]=p.dataset.v; S.day=null; render(); return; }
  const d=e.target.closest('[data-day]'); if(d){ S.day=S.day===d.dataset.day?null:d.dataset.day; render(); return; }
  const tb=e.target.closest('[data-tab]'); if(tb){ S.fav=tb.dataset.tab==='saved'; render(); return; }
  const v=e.target.closest('[data-view]'); if(v){ $$('[data-view]').forEach(x=>x.classList.toggle('is-on',x===v)); $('#calwrap').hidden=v.dataset.view==='list'; return; }
  if(e.target.closest('#prev')){ S.month=new Date(S.month.getFullYear(),S.month.getMonth()-1,1); cal(); return; }
  if(e.target.closest('#next')){ S.month=new Date(S.month.getFullYear(),S.month.getMonth()+1,1); cal(); return; }
  const q=e.target.closest('[data-q]'); if(q){ const t=today(); let f=t,to; if(q.dataset.q==='wk'){ const add=(6-t.getDay()+7)%7; f=new Date(+t+add*DAY); to=new Date(+f+DAY);} else if(q.dataset.q==='m1') to=new Date(+t+30*DAY); else to=new Date(+t+90*DAY);
    S.from=iso(f); S.to=iso(to); $('#from').value=S.from; $('#to').value=S.to; S.day=null; S.month=new Date(f.getFullYear(),f.getMonth(),1); render(); }
});
$('#q').oninput=e=>{S.q=e.target.value.trim();S.day=null;render();};
$('#from').onchange=e=>{S.from=e.target.value;render();}; $('#to').onchange=e=>{S.to=e.target.value;render();};
$('#reset').onclick=()=>{Object.assign(S,{status:'all',region:'전체',dist:'전체',q:'',from:'',to:'',day:null});['q','from','to'].forEach(i=>$('#'+i).value='');render();};
bindFav(()=>{ if(S.fav) render(); else {$('#savedcnt').textContent=favs.get().length; $$('#list .ed-race').length; } });
if(S.from) $('#from').value=S.from; if(S.to) $('#to').value=S.to;
render();

});
</script></body></html>
