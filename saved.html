<link rel="icon" href="favicon.ico" sizes="48x48"><link rel="icon" href="assets/logo/favicon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/logo/apple-touch-icon.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap"></noscript>
<link rel="stylesheet" href="design-tokens.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="site.css">
<script src="data.js"></script><script src="app.js"></script></head><body>
<main class="ed-wrap" id="main">
<div style="padding:28px var(--page-x) 0"><div class="ed-label">06 — Saved</div><h1 class="ed-h1" style="margin:12px 0 10px">저장</h1><p class="ed-lede">북마크한 대회와 코스예요. 저장 목록은 이 기기의 브라우저에만 보관돼요.</p></div>
<section class="ed-section" style="margin-top:32px"><div class="ed-section-head major"><span class="no">01</span><h2 class="ed-h2">저장한 대회</h2><span class="ed-small ed-tab-num"><b id="n1" style="color:var(--ink)">0</b>개</span></div>
  <div id="goalBox"></div><div class="ed-list" id="raceOut" style="border-top:0"></div>
  <p class="ed-small" id="raceTools" style="margin-top:14px;display:flex;flex-wrap:wrap;gap:6px 18px"></p></section>
<section class="ed-section" style="margin-top:36px"><div class="ed-section-head major"><span class="no">02</span><h2 class="ed-h2">저장한 코스</h2><span class="ed-small ed-tab-num"><b id="n2" style="color:var(--ink)">0</b>개</span></div>
  <div class="ed-list" id="courseOut" style="border-top:0"></div></section>
</main>
<script>
layout('saved');
RACES_READY.then(()=>{
  function drawRaces(){
    const all=allRaces().filter(r=>favs.has(r.id)).sort((a,b)=>a.d-b.d), up=all.filter(r=>r.st.key!=='ended'), past=all.filter(r=>r.st.key==='ended');
    const known=new Set(allRaces().map(r=>r.id)), lost=favs.get().filter(id=>!known.has(id)).length;
    $('#n1').textContent=favs.get().length;
    const g=up.find(r=>r.d>=0);
    $('#goalBox').innerHTML=g?`<div style="padding:4px 0 18px;border-bottom:1px solid var(--rule);margin-bottom:4px"><div class="ed-label">NEXT — 가장 가까운 저장 대회</div><div style="display:flex;align-items:baseline;gap:14px;margin-top:6px"><span class="ed-dday ${ddayCls(g)}" style="font-size:44px">${ddayText(g.d)}</span><a class="ed-h2" href="race.html?id=${g.id}" style="font-weight:600">${esc(g.name)}</a></div><p class="ed-small" style="margin-top:6px"><a class="ed-link" href="tools.html?date=${g.date}">이 대회로 훈련 계획 만들기 →</a></p></div>`:'';
    $('#raceOut').innerHTML=up.length?up.map(raceRow).join(''):`<div class="ed-empty">저장한 대회가 없어요. <a class="ed-link" href="races.html">대회 달력</a>에서 북마크를 눌러 보세요.</div>`;
    if(past.length) $('#raceOut').insertAdjacentHTML('beforeend',`<h3 class="ed-label" style="margin:22px 0 4px">지난 대회</h3>${past.map(raceRow).join('')}`);
    if(lost) $('#raceOut').insertAdjacentHTML('beforeend',`<p class="ed-small" style="margin-top:10px">목록에서 사라진 대회 ${lost}개는 지난 대회이거나 수집 범위(향후 6개월) 밖이에요.</p>`);
    $('#raceTools').innerHTML=up.length?`<button type="button" class="ed-link ed-textbtn" id="icsAll">저장한 대회 모두 캘린더에 추가(.ics)</button>`:'';
    const b=$('#icsAll'); if(b) b.onclick=()=>downloadText('saved-races.ics',raceIcs(up),'text/calendar');
  }
  function drawCourses(){
    const ids=cfavs.get(), cs=(window.COURSES||[]).filter(c=>ids.includes(c.id));
    $('#n2').textContent=ids.length;
    $('#courseOut').innerHTML=cs.length?cs.map((c,i)=>`<article class="ed-course" data-id="${c.id}"><span class="ix">${p2(i+1)}</span><div><h3>${esc(c.name)}</h3><p class="ed-meta">${esc(c.region)}${sep}${c.km?c.km+'km':'거리 확인 필요'}</p><a class="ed-link ed-small" style="display:inline-block;margin-top:6px;color:var(--ink-2)" target="_blank" rel="noopener noreferrer" href="${naverMap(c.name+' 러닝')}">지도에서 보기 ↗</a></div><div class="ed-race-side">${bookmark(c.id,true,'data-cfav','코스 저장 해제')}</div></article>`).join(''):`<div class="ed-empty">저장한 코스가 없어요. <a class="ed-link" href="courses.html">러닝 코스</a>에서 북마크를 눌러 보세요.</div>`;
  }
  drawRaces(); drawCourses();
  bindFav(()=>{ drawRaces(); drawCourses(); });
});
</script></body></html>
